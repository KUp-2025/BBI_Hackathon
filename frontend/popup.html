<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; font-family: 'Segoe UI', sans-serif; padding: 15px; background: #f8f9fa; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    h2 { margin: 0; font-size: 16px; color: #333; }
    
    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #2196F3; }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Logs */
    .log-container { background: white; border: 1px solid #ddd; border-radius: 5px; height: 200px; overflow-y: auto; padding: 10px; }
    .log-item { border-bottom: 1px solid #eee; padding: 8px 0; font-size: 12px; }
    .log-item:last-child { border-bottom: none; }
    .log-title { font-weight: bold; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-time { color: #888; font-size: 10px; }
    .status-badge { float: right; padding: 2px 6px; border-radius: 4px; font-size: 10px; color: white; }
    .status-blocked { background: #e74c3c; }
    .status-allowed { background: #2ecc71; }
    
    .clear-btn { margin-top: 10px; width: 100%; padding: 8px; border: none; background: #ddd; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>🛡️ DDAS Monitor</h2>
    <label class="switch">
      <input type="checkbox" id="toggleSwitch" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="log-container" id="logList">
    <div style="text-align:center; color:#999; margin-top: 80px;">No recent duplicates</div>
  </div>

  <button class="clear-btn" id="clearLogs">Clear History</button>
  <script src="popup.js"></script>
</body>
</html>
