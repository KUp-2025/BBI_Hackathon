<!DOCTYPE html>
<html>
<head>
  <title>DDAS Alert</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      text-align: center;
      background: #ffffff;
      width: 360px; 
      margin: 0;
      box-sizing: border-box;
      color: #333;
    }

    /* Icon Container */
    .icon-wrapper {
      background: #fff3cd;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .icon { font-size: 28px; }

    /* Headings */
    h3 { 
      margin: 0 0 8px; 
      color: #856404; 
      font-size: 18px; 
      font-weight: 700; 
    }
    
    .warning-text {
      color: #666;
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* Details Card */
    .details-card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    
    .detail-row {
      display: grid;
      grid-template-columns: 80px 1fr; /* Fixed label width, flexible content */
      margin-bottom: 8px;
      font-size: 13px;
      align-items: baseline;
    }
    .detail-row:last-child { margin-bottom: 0; }
    
    .label { 
      color: #888; 
      font-weight: 500; 
    }
    
    .value { 
      color: #212529; 
      font-weight: 600; 
      word-break: break-all; /* Force break long paths */
      line-height: 1.3;
    }

    /* Buttons */
    .btn-group { 
      display: flex; 
      gap: 12px; 
    }
    
    button {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }
    
    .cancel { 
      background: #ffffff; 
      color: #dc3545; 
      border: 1px solid #dc3545; 
    }
    .cancel:hover { background: #fff5f5; }

    .continue { 
      background: #0d6efd; 
      color: white; 
      border: 1px solid #0d6efd;
    }
    .continue:hover { 
      background: #0b5ed7; 
      box-shadow: 0 2px 4px rgba(13, 110, 253, 0.2); 
    }

  </style>
</head>
<body>

  <div class="icon-wrapper">
    <div class="icon">⚠️</div>
  </div>

  <h3>Duplicate Detected</h3>
  <p class="warning-text">An identical file was found on your system.</p>
  
  <div class="details-card">
    <div class="detail-row">
      <span class="label">File:</span>
      <span class="value" id="fname">Reading...</span>
    </div>
    <div class="detail-row">
      <span class="label">Size:</span>
      <span class="value" id="fsize">Reading...</span>
    </div>
    <div class="detail-row">
      <span class="label">Path:</span>
      <span class="value" id="fpath">Reading...</span>
    </div>
  </div>

  <div class="btn-group">
    <button id="cancelBtn" class="cancel">Stop Download</button>
    <button id="contBtn" class="continue">Download Anyway</button>
  </div>

  <script src="prompt.js"></script>
</body>
</html>
